spring: 
    application:
        name: feature-flag-platform
    datasource: 
        url: jdbc:postgresql://localhost:5432/flags
        username: postgres
        password: secret
    jpa: 
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true

management:
    endpoints:
        web:
            exposure:
                include: health, info, metrics
